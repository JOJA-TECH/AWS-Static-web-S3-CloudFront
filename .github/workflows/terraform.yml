name: Terraform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_ROOT: terraform/environments/prod
  AWS_REGION: us-east-1

permissions:
  id-token: write   # OIDC
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.15.9"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_ROOT }}

      - name: Terraform Init (no backend, plan-only)
        run: terraform init -backend=false
        working-directory: ${{ env.TF_ROOT }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_ROOT }}

      - name: Terraform Plan
        run: terraform plan -no-color
        working-directory: ${{ env.TF_ROOT }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v2
        with:
          tflint_version: latest

      - name: TFLint
        run: |
          tflint --init
          tflint
        working-directory: ${{ env.TF_ROOT }}

      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.TF_ROOT }}
          framework: terraform

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.TF_ROOT }}'

      - name: Terraform Docs
        uses: terraform-docs/gh-action@v1
        with:
          working-dir: ${{ env.TF_ROOT }}

  apply:
    needs: terraform
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.9.0"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap backend (S3 bucket + DynamoDB lock table)
        run: |
          if [ "${{ env.AWS_REGION }}" = "us-east-1" ]; then
            aws s3api head-bucket --bucket "${{ secrets.TF_STATE_BUCKET }}" 2>/dev/null || \
              aws s3api create-bucket --bucket "${{ secrets.TF_STATE_BUCKET }}" --region "${{ env.AWS_REGION }}"
          else
            aws s3api head-bucket --bucket "${{ secrets.TF_STATE_BUCKET }}" 2>/dev/null || \
              aws s3api create-bucket --bucket "${{ secrets.TF_STATE_BUCKET }}" --region "${{ env.AWS_REGION }}" --create-bucket-configuration LocationConstraint="${{ env.AWS_REGION }}"
          fi
          aws dynamodb describe-table --table-name "${{ secrets.TF_STATE_LOCK_TABLE }}" 2>/dev/null || \
          aws dynamodb describe-table --table-name "${{ secrets.TF_STATE_LOCK_TABLE }}" 2>/dev/null || \
            aws dynamodb create-table --table-name "${{ secrets.TF_STATE_LOCK_TABLE }}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_ROOT }}
        env:
          TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
          TF_VAR_state_lock_table: ${{ secrets.TF_STATE_LOCK_TABLE }}

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan
        working-directory: ${{ env.TF_ROOT }}
        env:
          TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
          TF_VAR_state_lock_table: ${{ secrets.TF_STATE_LOCK_TABLE }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_ROOT }}
        env:
          TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
          TF_VAR_state_lock_table: ${{ secrets.TF_STATE_LOCK_TABLE }}
