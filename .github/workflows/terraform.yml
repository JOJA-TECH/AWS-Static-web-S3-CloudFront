name: Terraform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_ROOT: terraform/environments/prod
  AWS_REGION: us-east-1
  TF_VAR_domain_name: joja.click
  TF_VAR_route53_zone_name: joja.click
  TF_VAR_create_route53_zone: "true"

permissions:
  id-token: write   # OIDC
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        run: terraform init -backend=false
        working-directory: ${{ env.TF_ROOT }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_ROOT }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: TFLint
        run: |
          tflint --init
          tflint
        working-directory: ${{ env.TF_ROOT }}

      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.TF_ROOT }}
          framework: terraform

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.TF_ROOT }}'

      - name: Terraform Docs
        uses: terraform-docs/gh-actions@v1
        with:
          working-dir: ${{ env.TF_ROOT }}

  apply:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap backend (S3 bucket)
        run: |
          if [ "$AWS_REGION" = "us-east-1" ]; then
            aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null || \
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION"
          else
            aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null || \
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION" --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi

      - name: Terraform Init
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET"
        working-directory: ${{ env.TF_ROOT }}

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan
        working-directory: ${{ env.TF_ROOT }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_ROOT }}
