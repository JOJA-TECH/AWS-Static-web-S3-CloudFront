name: Deploy Static Content

on:
  workflow_run:
    workflows: [Terraform CI/CD]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  TF_ROOT: terraform/environments/prod
  AWS_REGION: us-east-1
  FRONTEND_DIR: frontend

permissions:
  id-token: write   # OIDC
  contents: read

jobs:
  deploy-content:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get infrastructure outputs
        id: outputs
        run: |
          terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE"
          BUCKET=$(terraform output -raw activos_bucket_name)
          DISTRIBUTION=$(terraform output -raw cloudfront_distribution_id)
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "distribution=$DISTRIBUTION" >> $GITHUB_OUTPUT
        working-directory: ${{ env.TF_ROOT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: ${{ env.FRONTEND_DIR }}

      - name: Build frontend
        run: pnpm run build
        working-directory: ${{ env.FRONTEND_DIR }}

      - name: Sync static content to S3
        run: aws s3 sync ${{ env.FRONTEND_DIR }}/dist/ "s3://${{ steps.outputs.outputs.bucket }}" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.outputs.outputs.distribution }}" --paths "/*"
